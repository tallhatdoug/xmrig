name: ci

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            artifact: xmrig
            package: xmrig-linux-x64.tar.gz
          - name: windows-x64
            os: windows-2022
            artifact: xmrig.exe
            package: xmrig-windows-x64.zip
          - name: macos-x64
            os: macos-15-intel
            artifact: xmrig
            package: xmrig-macos-x64.tar.gz
          - name: macos-arm64
            os: macos-15
            artifact: xmrig
            package: xmrig-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          {
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              cmake \
              libuv1-dev \
              libssl-dev \
              libhwloc-dev
          } 2>&1 | tee build.log

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake libuv openssl hwloc 2>&1 | tee build.log

      - name: Install Windows Bash tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            set -euxo pipefail
            if ! command -v wget >/dev/null 2>&1; then
              mkdir -p /usr/bin
              curl -fL -o /usr/bin/wget.exe \
                https://eternallybored.org/misc/wget/1.21.4/64/wget.exe
            fi
            wget --version
          } 2>&1 | tee build.log

      - name: Build Windows dependencies
        if: runner.os == 'Windows'
        shell: bash
        run: |
          {
            set -euxo pipefail
            export DEPS="$(cygpath -u '${{ runner.workspace }}/deps')"
            mkdir -p "$DEPS"

            export UV_ROOT="$DEPS/uv"
            export OPENSSL_ROOT_DIR="$DEPS/openssl"
            export HWLOC_ROOT="$DEPS/hwloc"

            ./scripts/build.uv.sh
            ./scripts/build.openssl3.sh
            ./scripts/build.hwloc.sh
          } 2>&1 | tee -a build.log

      - name: Configure
        shell: bash
        run: |
          {
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              export DEPS="$(cygpath -u '${{ runner.workspace }}/deps')"
              export UV_ROOT="$DEPS/uv"
              export OPENSSL_ROOT_DIR="$DEPS/openssl"
              export HWLOC_ROOT="$DEPS/hwloc"

              cmake -S . -B build \
                -G "Visual Studio 17 2022" -A x64 \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_CN_LITE=OFF \
                -DWITH_CN_HEAVY=OFF \
                -DWITH_CN_PICO=OFF \
                -DWITH_CN_FEMTO=OFF \
                -DWITH_ARGON2=OFF \
                -DWITH_KAWPOW=OFF \
                -DWITH_GHOSTRIDER=OFF \
                -DWITH_OPENCL=OFF \
                -DWITH_CUDA=OFF \
                -DWITH_BENCHMARK=OFF
            else
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_CN_LITE=OFF \
                -DWITH_CN_HEAVY=OFF \
                -DWITH_CN_PICO=OFF \
                -DWITH_CN_FEMTO=OFF \
                -DWITH_ARGON2=OFF \
                -DWITH_KAWPOW=OFF \
                -DWITH_GHOSTRIDER=OFF \
                -DWITH_OPENCL=OFF \
                -DWITH_CUDA=OFF \
                -DWITH_BENCHMARK=OFF
            fi
          } 2>&1 | tee -a build.log

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2>&1 |
            tee -a build.log

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist package

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f "build/Release/${{ matrix.artifact }}"
            cp "build/Release/${{ matrix.artifact }}" dist/
          else
            test -f "build/${{ matrix.artifact }}"
            cp "build/${{ matrix.artifact }}" dist/
          fi
          cp doc/FORK_FEATURES.md dist/

          if [[ "${{ matrix.package }}" == *.zip ]]; then
            (
              cd dist
              7z a "../package/${{ matrix.package }}" .
            )
          else
            tar -czf "package/${{ matrix.package }}" -C dist .
          fi

          (
            cd package
            sha256sum "${{ matrix.package }}" > "${{ matrix.package }}.sha256"
            ls -lh | tee ../packages.txt
          )

          cat packages.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: package/*
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-diagnostics
          path: |
            build.log
            packages.txt
          if-no-files-found: ignore

  ci-summary:
    name: ci-summary
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    steps:
      - name: Download diagnostics
        uses: actions/download-artifact@v6
        with:
          pattern: '*-diagnostics'
          path: diagnostics
          merge-multiple: true

      - name: Print all diagnostics
        shell: bash
        run: |
          set +e
          for file in $(find diagnostics -type f | sort); do
            echo "================ $file ================"
            cat "$file"
            echo
          done
