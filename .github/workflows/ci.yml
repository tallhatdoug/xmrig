name: ci

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  windows-deps:
    name: prepare-windows-dependencies
    runs-on: windows-2022
    outputs:
      deps-prefix: ${{ steps.paths.outputs.deps-prefix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set paths
        id: paths
        shell: pwsh
        run: |
          "deps-prefix=$env:RUNNER_WORKSPACE\deps" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download and build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          DEPS="${{ steps.paths.outputs.deps-prefix }}"
          mkdir -p "$DEPS/src" "$DEPS/prefix"

          cd "$DEPS/src"
          curl -fL -o libuv.tar.gz \
            https://github.com/libuv/libuv/archive/refs/tags/v1.51.0.tar.gz
          curl -fL -o hwloc.tar.gz \
            https://download.open-mpi.org/release/hwloc/v2.12/hwloc-2.12.2.tar.gz

          tar -xzf libuv.tar.gz
          tar -xzf hwloc.tar.gz

          cmake -S libuv-1.51.0 -B libuv-build \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_INSTALL_PREFIX="$DEPS/prefix" \
            -DBUILD_TESTING=OFF
          cmake --build libuv-build --config Release --target install

          cd hwloc-2.12.2
          ./configure \
            --prefix="$DEPS/prefix" \
            --disable-shared \
            --enable-static \
            --disable-cairo \
            --disable-libxml2 \
            --disable-pci \
            --disable-opencl \
            --disable-cuda \
            --disable-nvml \
            --disable-rsmi
          make -j2
          make install

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.paths.outputs.deps-prefix }}/prefix
          key: windows-deps-v1

      - name: Upload dependency logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-deps-log
          path: ${{ steps.paths.outputs.deps-prefix }}/src
          if-no-files-found: ignore

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: windows-deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            artifact: xmrig
            package: xmrig-linux-x64.tar.gz
          - name: windows-x64
            os: windows-2022
            artifact: xmrig.exe
            package: xmrig-windows-x64.zip
          - name: macos-x64
            os: macos-15-intel
            artifact: xmrig
            package: xmrig-macos-x64.tar.gz
          - name: macos-arm64
            os: macos-15
            artifact: xmrig
            package: xmrig-macos-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          {
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              cmake \
              libuv1-dev \
              libssl-dev \
              libhwloc-dev
          } 2>&1 | tee build.log

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake libuv hwloc 2>&1 | tee build.log

      - name: Restore Windows dependencies
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.workspace }}/deps/prefix
          key: windows-deps-v1
          fail-on-cache-miss: true

      - name: Configure
        shell: bash
        run: |
          {
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              DEPS="$(cygpath -u '${{ runner.workspace }}/deps/prefix')"
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DUV_INCLUDE_DIR="$DEPS/include" \
                -DUV_LIBRARY="$DEPS/lib/uv_a.lib" \
                -DHWLOC_INCLUDE_DIR="$DEPS/include" \
                -DHWLOC_LIBRARY="$DEPS/lib/libhwloc.a" \
                -DWITH_CN_LITE=OFF \
                -DWITH_CN_HEAVY=OFF \
                -DWITH_CN_PICO=OFF \
                -DWITH_CN_FEMTO=OFF \
                -DWITH_ARGON2=OFF \
                -DWITH_KAWPOW=OFF \
                -DWITH_GHOSTRIDER=OFF \
                -DWITH_OPENCL=OFF \
                -DWITH_CUDA=OFF \
                -DWITH_BENCHMARK=OFF
            else
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DWITH_CN_LITE=OFF \
                -DWITH_CN_HEAVY=OFF \
                -DWITH_CN_PICO=OFF \
                -DWITH_CN_FEMTO=OFF \
                -DWITH_ARGON2=OFF \
                -DWITH_KAWPOW=OFF \
                -DWITH_GHOSTRIDER=OFF \
                -DWITH_OPENCL=OFF \
                -DWITH_CUDA=OFF \
                -DWITH_BENCHMARK=OFF
            fi
          } 2>&1 | tee -a build.log

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --parallel 2>&1 |
            tee -a build.log

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            test -f "build/Release/${{ matrix.artifact }}"
            cp "build/Release/${{ matrix.artifact }}" dist/
          else
            test -f "build/${{ matrix.artifact }}"
            cp "build/${{ matrix.artifact }}" dist/
          fi
          cp doc/FORK_FEATURES.md dist/

          if [[ "${{ matrix.package }}" == *.zip ]]; then
            7z a "dist/${{ matrix.package }}" ./dist/*
          else
            tar -czf "dist/${{ matrix.package }}" -C dist .
          fi

          (
            cd dist
            sha256sum "${{ matrix.package }}" > "${{ matrix.package }}.sha256"
            ls -lh | tee ../packages.txt
          )

          cat packages.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}-diagnostics
          path: |
            build.log
            packages.txt
          if-no-files-found: ignore
